spring:
  application:
    name: booknest
  datasource:
    url: ${BOOKNEST_DB_URL:jdbc:postgresql://localhost:5432/booknest}
    username: ${BOOKNEST_DB_USER:booknest}
    password: ${BOOKNEST_DB_PASSWORD:booknest_local_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: always
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, db

booknest:
  demo-data:
    enabled: ${BOOKNEST_DEMO_DATA_ENABLED:false}

server:
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      cookie:
        name: BOOKNEST_SESSION
        http-only: true
        same-site: lax
