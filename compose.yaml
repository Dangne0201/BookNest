name: booknest

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${BOOKNEST_DB_NAME:-booknest}
      POSTGRES_USER: ${BOOKNEST_DB_USER:-booknest}
      POSTGRES_PASSWORD: ${BOOKNEST_DB_PASSWORD:-booknest_local_only}
    volumes:
      - booknest-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      BOOKNEST_DB_URL: jdbc:postgresql://db:5432/${BOOKNEST_DB_NAME:-booknest}
      BOOKNEST_DB_USER: ${BOOKNEST_DB_USER:-booknest}
      BOOKNEST_DB_PASSWORD: ${BOOKNEST_DB_PASSWORD:-booknest_local_only}
    ports:
      - "127.0.0.1:${BOOKNEST_APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

volumes:
  booknest-postgres-data:
    name: booknest-postgres-data
